        }

            height: 75px;

            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px auto;
            font-size: 1.8rem;
            font-weight: bold;
            color: #4a4a4a;
            background-color: white;
            will-change: transform;
        }
        .step {
            background-color: rgb(255, 255, 255);
            border: 1px solid rgb(224, 224, 224);
            border-radius: 8px;
            box-shadow: rgba(0, 0, 0, 0.1) 0px 2px 4px 0px;
            color: rgb(51, 51, 51);
            font-size: 0.85rem;
            padding: 10px;
            margin-bottom: 8px;
            text-align: left;
            transition: all 0.3s ease;
            width: 100%;
            box-sizing: border-box;
        }
        .step.active {
            background-color: rgb(66, 153, 225);
            color: white;
        }
        .cycles {
            margin: 15px 0;
            font-size: 0.9rem;
            font-weight: bold;
        }
        button {
            align-items: flex-start;
            appearance: auto;
            background-color: rgb(72, 187, 120);
            border: none;
            border-radius: 25px;
            box-sizing: border-box;
            color: rgb(255, 255, 255);
            cursor: pointer;
            display: block;
            font-family: system-ui;
            font-size: 16px;
            font-weight: 700;
            height: 38px;
            line-height: normal;
            margin: 0 auto;
            padding: 10px 15px;
            text-align: center;
            touch-action: manipulation;
            transition: background-color 0.1s ease, transform 0.1s ease;
            width: 240px;
            word-spacing: 0px;
            -webkit-user-select: none;
        }
        button:hover {
            opacity: 0.9;
        }

            position: absolute;
            top: 10px;
            left: 10px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background-color: #f5f5f7;
            color: #4a4a4a;
            text-decoration: none;

            let wakeLockWanted = false;
            async function requestWakeLock() {
                wakeLockWanted = true;
                if (!('wakeLock' in navigator)) return;
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (e) {
                    // Wake lock is best-effort; the exercise still works without it
                }
            }
            function releaseWakeLock() {
                wakeLockWanted = false;
                if (wakeLock) {
                    wakeLock.release().catch(function() {});
                    wakeLock = null;
                }
            }
            document.addEventListener('visibilitychange', function() {
                if (document.visibilityState === 'visible' && wakeLockWanted) {
                    requestWakeLock();
                }
            });

            let currentStep = 0;
            let isRunning = false;
            let timer;
            let cycles = 0;
            let seconds = 5;

            function updateUI() {
                document.getElementById('title').textContent = t.title;
                document.getElementById('subtitle').textContent = t.subtitle;
                t.steps.forEach((step, index) => {
                    document.getElementById(`step${index}`).textContent = step;
                });
                document.getElementById('controlBtn').textContent = t.startBtn;
                updateDisplay();
            }

            // Grow the circle while inhaling (steps 0 and 2) and shrink it
            // while exhaling (steps 1 and 3), as a visual pacing guide
            function animateGuide() {
                const circle = document.getElementById('timer');
                if (!isRunning) {
                    circle.style.transition = 'transform 0.5s ease';
                    circle.style.transform = 'scale(1)';
                    return;
                }
                circle.style.transition = 'transform 5s ease-in-out';
                circle.style.transform = currentStep % 2 === 0 ? 'scale(1.2)' : 'scale(1)';
            }

            function updateDisplay() {
                document.getElementById('timer').textContent = seconds;
                document.getElementById('cycleCounter').textContent = t.cyclesText.replace('{0}', cycles);
                t.steps.forEach((step, index) => {
                    const stepElement = document.getElementById(`step${index}`);
                    stepElement.classList.toggle('active', index === currentStep);
                });
                animateGuide();
            }

            function nextStep() {
                currentStep = (currentStep + 1) % t.steps.length;
                if (currentStep === 0) {
                    cycles++;
                    if (cycles === 4) {
                        stopExercise();
                        return;
                    }
                }
                seconds = 5;
                updateDisplay();
            }

            function startStop() {
                if (isRunning) {
                    stopExercise();
                } else {
                    startExercise();
                }
            }

            function startExercise() {
                isRunning = true;
                requestWakeLock();
                updateDisplay();
                document.getElementById('controlBtn').textContent = t.stopBtn;
                timer = setInterval(function() {
                    if (seconds > 1) {
                        seconds--;
                        updateDisplay();
                    } else {
                        nextStep();
                    }
                }, 1000);
            }

            function stopExercise() {
                clearInterval(timer);
                isRunning = false;
                releaseWakeLock();
                document.getElementById('controlBtn').textContent = t.restartBtn;
                currentStep = 0;
                cycles = 0;
                seconds = 5;
                updateDisplay();
            }

            document.getElementById('controlBtn').addEventListener('click', startStop);

            updateUI();
        } catch (error) {
            console.error('An error occurred:', error);
        }
    });
    </script>
</body>
</html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pusteøvelse / Breathing Exercise</title>
    <meta name="theme-color" content="#667eea">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap');
        
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
        }

        .container {
            position: relative;
            text-align: center;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 15px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 100%;
            max-width: 320px;
            margin-top: 10px;
        }

        .home-link {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background-color: #f7fafc;
            color: #4a5568;
            text-decoration: none;
            font-size: 18px;
            line-height: 1;
        }

        .home-link:hover {
            background-color: #e2e8f0;
        }

        h1 {
            color: #4a5568;
            margin: 0 0 5px;
            font-size: 22px;
        }

        h2 {
            color: #718096;
            margin: 0 0 10px;
            font-size: 14px;
            font-weight: normal;
        }

        .phase {
            margin-bottom: 8px;
            padding: 8px;
            border-radius: 10px;
            transition: all 0.3s ease;
            background-color: #f7fafc;
            font-size: 14px;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .active {
            background-color: #4299e1;
            color: white;
            box-shadow: 0 4px 6px rgba(66, 153, 225, 0.5);
        }

        #cycles {
            margin: 10px 0;
            font-weight: bold;
            color: #4a5568;
            font-size: 14px;
            height: 20px;
        }

        button {
            background-color: #48bb78;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 50px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s ease;
            outline: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            touch-action: manipulation;
        }

        button:hover, button:active {
            background-color: #38a169;
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(72, 187, 120, 0.4);
        }

        button.stop {
            background-color: #f56565;
        }

        button.stop:hover, button.stop:active {
            background-color: #e53e3e;
            box-shadow: 0 4px 6px rgba(245, 101, 101, 0.4);
        }

        .progress-ring {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 16px auto;
            will-change: transform;
        }

        .progress-ring__circle {
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
            transition: stroke-dashoffset 0.35s;
        }

        .time-left {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="home-link" aria-label="Home"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg></a>
        <h1 id="title">Pusteøvelse</h1>

            const userLanguage = navigator.language.split('-')[0];
            const lang = translations[userLanguage] ? userLanguage : 'en';
            document.documentElement.lang = lang;

            let wakeLock = null;
            let wakeLockWanted = false;
            async function requestWakeLock() {
                wakeLockWanted = true;
                if (!('wakeLock' in navigator)) return;
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (e) {
                    // Wake lock is best-effort; the exercise still works without it
                }
            }
            function releaseWakeLock() {
                wakeLockWanted = false;
                if (wakeLock) {
                    wakeLock.release().catch(function() {});
                    wakeLock = null;
                }
            }
            document.addEventListener('visibilitychange', function() {
                if (document.visibilityState === 'visible' && wakeLockWanted) {
                    requestWakeLock();
                }
            });


            document.getElementById('title').textContent = translations[lang].title;
            document.getElementById('subtitle').textContent = translations[lang].subtitle;

            const phases = [
                { name: translations[lang].phase1, duration: 4, element: document.getElementById('phase1'), countUp: true },
                { name: translations[lang].phase2, duration: 7, element: document.getElementById('phase2'), countUp: false },
                { name: translations[lang].phase3, duration: 8, element: document.getElementById('phase3'), countUp: false }
            ];

            let currentPhase = 0;
            let timeLeft = 0;
            let cyclesCompleted = 0;
            let isActive = false;
            let lastTime = 0;
            let accumulatedTime = 0;

            const startStopButton = document.getElementById('startStop');
            const cyclesElement = document.getElementById('cycles');
            const timeLeftElement = document.getElementById('timeLeft');
            const progressCircle = document.getElementById('progress-circle');
            const progressRing = document.querySelector('.progress-ring');
            const circumference = 2 * Math.PI * 42;

            progressCircle.style.strokeDasharray = `${circumference} ${circumference}`;
            progressCircle.style.strokeDashoffset = circumference;

            function setProgress(percent) {
                const offset = circumference - (percent / 100 * circumference);
                progressCircle.style.strokeDashoffset = offset;
            }

            // Grow the ring while inhaling, keep it large during the hold and
            // shrink it back while exhaling, as a visual pacing guide
            function animateGuide() {
                if (!isActive) {
                    progressRing.style.transition = 'transform 0.5s ease';
                    progressRing.style.transform = 'scale(1)';
                    return;
                }
                if (currentPhase === 0) {
                    progressRing.style.transition = `transform ${phases[0].duration}s ease-in-out`;
                    progressRing.style.transform = 'scale(1.2)';
                } else if (currentPhase === 1) {
                    progressRing.style.transition = 'transform 0.3s ease';
                    progressRing.style.transform = 'scale(1.2)';
                } else {
                    progressRing.style.transition = `transform ${phases[2].duration}s ease-in-out`;
                    progressRing.style.transform = 'scale(1)';
                }
            }

            function updateDisplay() {
                phases.forEach((phase, index) => {
                    phase.element.classList.toggle('active', index === currentPhase && isActive);
                    phase.element.textContent = `${phase.name}: ${phase.duration} ${translations[lang].seconds}`;
                });
                cyclesElement.textContent = `${translations[lang].cycles}: ${cyclesCompleted} / 4`;
                startStopButton.textContent = isActive ? translations[lang].stop : translations[lang].start;
                startStopButton.classList.toggle('stop', isActive);
                
                if (isActive) {
                    const currentPhaseObj = phases[currentPhase];
                    const displayTime = currentPhaseObj.countUp ? currentPhaseObj.duration - timeLeft : timeLeft;
                    timeLeftElement.textContent = displayTime;
                    
                    const progress = ((currentPhaseObj.duration - timeLeft) / currentPhaseObj.duration) * 100;
                    setProgress(progress);
                } else {
                    timeLeftElement.textContent = '';
                    setProgress(0);
                }
                animateGuide();
            }

            function nextPhase() {
                currentPhase = (currentPhase + 1) % phases.length;
                if (currentPhase === 0) {
                    cyclesCompleted++;
                    if (cyclesCompleted >= 4) {
                        finishExercise();
                        return;
                    }
                }
                timeLeft = phases[currentPhase].duration;
                accumulatedTime = 0;
            }

            function tick(currentTime) {
                if (!isActive) return;
                
                if (lastTime === 0) {
                    lastTime = currentTime;
                }

                const deltaTime = currentTime - lastTime;
                accumulatedTime += deltaTime;

                if (accumulatedTime >= 1000) {
                    timeLeft--;
                    accumulatedTime -= 1000;
                    if (timeLeft < 0) {
                        nextPhase();
                    }
                    updateDisplay();
                }

                lastTime = currentTime;
                requestAnimationFrame(tick);
            }

            function startExercise() {
                isActive = true;
                currentPhase = 0;
                cyclesCompleted = 0;
                timeLeft = phases[currentPhase].duration;
                lastTime = 0;
                accumulatedTime = 0;
                requestWakeLock();
                updateDisplay();
                requestAnimationFrame(tick);
            }

            function stopExercise() {
                isActive = false;
                currentPhase = 0;
                cyclesCompleted = 0;
                lastTime = 0;
                accumulatedTime = 0;
                releaseWakeLock();
                updateDisplay();
            }

            // Like stopExercise, but keeps the 4/4 cycle count visible so the
            // user gets confirmation that the session finished
            function finishExercise() {
                isActive = false;
                currentPhase = 0;
                lastTime = 0;
                accumulatedTime = 0;
                releaseWakeLock();
                updateDisplay();
            }

            startStopButton.addEventListener('click', function() {
                if (isActive) {
                    stopExercise();
                } else {
                    startExercise();
                }
            });

            updateDisplay();
        });

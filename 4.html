    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            box-sizing: border-box;
        }
        body, html {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            background: linear-gradient(135deg, rgb(102, 126, 234) 0%, rgb(118, 75, 162) 100%);
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            align-items: center;
            overflow-x: hidden;
            overflow-y: auto;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .card {
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: rgba(0, 0, 0, 0.2) 0px 10px 30px 0px;
            color: rgb(51, 51, 51);
            width: 90%;
            max-width: 320px;
            padding: 15px;
            margin: 20px auto;
        }
        h2 {
            margin: 0 0 15px 0;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
        }
        .stats-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            font-size: 14px;
        }
        .stats-table th, .stats-table td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        .stats-table th {
            background-color: rgba(74, 144, 226, 0.1);
            font-weight: bold;
        }
        .back-button {
            background-color: rgb(72, 187, 120);
            color: white;
            border: none;
            padding: 10px 15px;
            width: 100%;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 15px;
            transition: background-color 0.1s, transform 0.1s;
            touch-action: manipulation;
        }
        .back-button:active {
            background-color: rgb(62, 177, 110);
            transform: scale(0.98);
        }
        .no-data {
            text-align: center;
            color: #666;
            padding: 10px;
            font-size: 14px;
        }
        #breathHoldHistory {
            font-size: 13px;
            line-height: 1.4;
            word-break: break-word;
            padding: 8px 0;
        }
        #breathHoldHistory strong {
            font-weight: 600;
        }
        .calendar {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .month {
            margin-bottom: 10px;
        }
        
        .month-title {
            font-weight: bold;
            margin-bottom: 5px;
        }
        
        .days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            font-size: 12px;
        }
        
        .day-header {
            text-align: center;
            font-weight: bold;
            color: #666;
            padding: 4px 0;
        }
        
        .day {
            aspect-ratio: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.05);
            min-width: 24px;
        }
        
        .day.empty {
            background: none;
        }
        
        .date {
            margin-bottom: 2px;
            font-size: 11px;
        }
        
        .day .dots {
            display: flex;
            gap: 2px;
        }
        
        .day .dot {
            width: 4px;
            height: 4px;
            border-radius: 50%;
            background: rgb(72, 187, 120);
        }
    </style>

        function formatTime(seconds) {
            const minutes = Math.floor(seconds / 60);
            const remainingSeconds = seconds % 60;
            return `${minutes}m ${remainingSeconds}s`;
        }

        function calculateAverageHold(breathHolds) {
            if (!breathHolds || breathHolds.length === 0) return 0;
            
            const totalDuration = breathHolds.reduce((sum, hold) => {
                // Handle both old number format and new object format
                const duration = typeof hold === 'number' ? hold : (hold.duration || 0);
                return sum + duration;
            }, 0);
            
            return Math.round(totalDuration / breathHolds.length);
        }

        function getStats() {
            const breathHolds = JSON.parse(localStorage.getItem('wimHofBreathHolds') || '[]');
            
            // Group holds into sessions (3 holds = 1 session)
            const sessions = [];
            for (let i = 0; i < breathHolds.length; i += 3) {
                const sessionHolds = breathHolds.slice(i, Math.min(i + 3, breathHolds.length));
                const timestamp = sessionHolds[0].timestamp || 
                    (Date.now() - ((breathHolds.length - i) / 3) * 24 * 60 * 60 * 1000);  // Estimate date for old data
                sessions.push({
                    holds: sessionHolds,
                    timestamp: timestamp
                });
            }

            // Calculate stats using sessions
            const currentMonth = new Date().getMonth();
            const currentYear = new Date().getFullYear();
            
            const monthSessions = sessions.filter(session => {
                const date = new Date(session.timestamp);
                return date.getMonth() === currentMonth && date.getFullYear() === currentYear;
            }).length;

            return {
                record: parseInt(localStorage.getItem('wimHofRecord')) || 0,
                lastSession: parseInt(localStorage.getItem('wimHofLastSession')) || 0,
                sessions: sessions.length,
                monthSessions: monthSessions,
                averageHold: calculateAverageHold(breathHolds)
            };
        }

        // Add a helper function to format the month
        function formatMonth(date) {
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            return `${months[date.getMonth()]}/${date.getFullYear().toString().slice(2)}`;
        }

        // Update the createCalendar function
        function createCalendar() {
            const breathHolds = JSON.parse(localStorage.getItem('wimHofBreathHolds') || '[]');
            const calendar = document.getElementById('calendar');
            calendar.innerHTML = '';
            
            // Group sessions by date using actual timestamps
            const sessionsByDate = new Map();
            
            // Process breath holds in groups of 3 (one session)
            for (let i = 0; i < breathHolds.length; i += 3) {
                const sessionHolds = breathHolds.slice(i, Math.min(i + 3, breathHolds.length));
                
                // Get timestamp from the first hold in the session
                // Handle both old and new data formats
                const timestamp = sessionHolds[0].timestamp || Date.now();  // Fallback to now for old data
                const sessionDate = new Date(timestamp);
                const dateKey = sessionDate.toISOString().split('T')[0];
                
                sessionsByDate.set(dateKey, (sessionsByDate.get(dateKey) || 0) + 1);
            }
            
            // Create array of all months from earliest to current
            const months = [];
            const now = new Date();
            let currentDate = new Date(now.getFullYear(), now.getMonth());
            
            // Find earliest date from actual session data
            let earliestDate = new Date();
            sessionsByDate.forEach((count, dateKey) => {
                const sessionDate = new Date(dateKey);
                if (sessionDate < earliestDate) {
                    earliestDate = sessionDate;
                }
            });
            
            // Create month array from earliest to current
            const startDate = new Date(earliestDate.getFullYear(), earliestDate.getMonth());
            while (currentDate >= startDate) {
                months.push({
                    year: currentDate.getFullYear(),
                    month: currentDate.getMonth()
                });
                currentDate.setMonth(currentDate.getMonth() - 1);
            }
            
            // Create calendar for each month
            months.forEach(({ year, month }) => {
                const firstDay = new Date(year, month, 1);
                const lastDay = new Date(year, month + 1, 0);
                
                const monthDiv = document.createElement('div');
                monthDiv.className = 'month';
                
                // Add month title
                const monthTitle = document.createElement('div');
                monthTitle.className = 'month-title';
                monthTitle.textContent = firstDay.toLocaleString('default', { month: 'long', year: 'numeric' });
                monthDiv.appendChild(monthTitle);
                
                // Add weekday headers
                const daysDiv = document.createElement('div');
                daysDiv.className = 'days';
                const weekdays = ['Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa', 'Su'];
                weekdays.forEach(day => {
                    const dayHeader = document.createElement('div');
                    dayHeader.className = 'day-header';
                    dayHeader.textContent = day;
                    daysDiv.appendChild(dayHeader);
                });
                
                // Adjust empty cells for Monday start
                const firstDayIndex = firstDay.getDay() === 0 ? 6 : firstDay.getDay() - 1;
                for (let i = 0; i < firstDayIndex; i++) {
                    const emptyDay = document.createElement('div');
                    emptyDay.className = 'day empty';
                    daysDiv.appendChild(emptyDay);
                }
                
                // Add all days of the month
                for (let date = 1; date <= lastDay.getDate(); date++) {
                    const dayDiv = document.createElement('div');
                    dayDiv.className = 'day';
                    
                    const dateDiv = document.createElement('div');
                    dateDiv.className = 'date';
                    dateDiv.textContent = date;
                    
                    const dotsDiv = document.createElement('div');
                    dotsDiv.className = 'dots';
                    
                    const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(date).padStart(2, '0')}`;
                    const sessions = sessionsByDate.get(dateKey) || 0;
                    
                    for (let i = 0; i < sessions; i++) {
                        const dot = document.createElement('div');
                        dot.className = 'dot';
                        dotsDiv.appendChild(dot);
                    }
                    
                    dayDiv.appendChild(dateDiv);
                    dayDiv.appendChild(dotsDiv);
                    daysDiv.appendChild(dayDiv);
                }
                
                monthDiv.appendChild(daysDiv);
                calendar.appendChild(monthDiv);
                
                // Add spacing between months
                if (months.indexOf({ year, month }) === 0) {
                    const spacer = document.createElement('div');
                    spacer.style.height = '20px';
                    calendar.appendChild(spacer);
                }
            });
        }

        // Add automatic refresh of calendar at midnight
        function setupCalendarRefresh() {
            const now = new Date();
            const tomorrow = new Date(now);
            tomorrow.setDate(tomorrow.getDate() + 1);
            tomorrow.setHours(0, 0, 0, 0);
            
            const timeUntilMidnight = tomorrow - now;
            
            // Refresh at midnight
            setTimeout(() => {
                updateDisplay();
                setupCalendarRefresh(); // Setup next day's refresh
            }, timeUntilMidnight);
        }

        // Update the updateDisplay function to also update the calendar
        const backLabels = {
            en: 'Back', nb: 'Tilbake', es: 'Volver', zh: '返回', hi: 'वापस',
            ar: 'رجوع', pt: 'Voltar', ru: 'Назад', ja: '戻る', de: 'Zurück',
            fr: 'Retour', ko: '뒤로', it: 'Indietro', tr: 'Geri', vi: 'Quay lại',
            pl: 'Wstecz'
        };

        function updateDisplay() {
            const userLang = navigator.language.split('-')[0];
            const t = translations[userLang] || translations.en;
            document.documentElement.lang = translations[userLang] ? userLang : 'en';

            // Update page text
            document.getElementById('title').textContent = t.title;
            document.getElementById('headerMetric').textContent = t.headerMetric;
            document.getElementById('headerValue').textContent = t.headerValue;
            document.getElementById('backButton').textContent = backLabels[userLang] || backLabels.en;

            const stats = getStats();
            const tbody = document.getElementById('statsBody');
            tbody.innerHTML = '';

            if (stats.record === 0 && stats.sessions === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="2" class="no-data">${t.noData}</td>
                    </tr>`;
                return;
            }

            const rows = [
                [t.allTimeRecord, formatTime(stats.record)],
                [t.averageHold, formatTime(stats.averageHold)],
                [t.lastSession, formatTime(stats.lastSession)],
                [t.monthSessions, stats.monthSessions],
                [t.totalSessions, stats.sessions]
            ];

            rows.forEach(([metric, value]) => {
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${metric}</td>
                    <td>${value}</td>
                `;
                tbody.appendChild(row);
            });

            // Add breath hold history
            const breathHolds = JSON.parse(localStorage.getItem('wimHofBreathHolds') || '[]');
            const breathHoldHistory = document.getElementById('breathHoldHistory');
            
            if (breathHolds.length > 0) {
                // Format each session (3 holds)
                const sessions = [];
                for (let i = 0; i < breathHolds.length; i += 3) {
                    const sessionHolds = breathHolds.slice(i, Math.min(i + 3, breathHolds.length));
                    const formattedHolds = sessionHolds.map(hold => {
                        const duration = typeof hold === 'number' ? hold : (hold.duration || 0);
                        const minutes = Math.floor(duration / 60);
                        const remainingSeconds = duration % 60;
                        return minutes > 0 ? 
                            `${minutes}:${remainingSeconds.toString().padStart(2, '0')}` : 
                            duration;
                    });
                    sessions.push(`(${formattedHolds.join(', ')})`);
                }
                
                // Group by month (for old format, assume recent dates)
                const now = new Date();
                const monthKey = formatMonth(now);
                breathHoldHistory.innerHTML = `<strong>${monthKey}</strong>: ${sessions.join(' ')}`;
            } else {
                breathHoldHistory.textContent = 'No breath holds recorded yet';
            }

            // Update calendar
            createCalendar();
        }

        // Initialize the page
        updateDisplay();

        // Call this after updateDisplay()
        setupCalendarRefresh();
    </script>

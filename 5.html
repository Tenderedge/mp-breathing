<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mind Movie</title>
    <meta name="theme-color" content="#667eea">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }
        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgb(102, 126, 234) 0%, rgb(118, 75, 162) 100%);
            z-index: -1;
        }
        .content {
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 10px;
            box-sizing: border-box;
        }
        .card {
            position: relative;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            box-shadow: rgba(0, 0, 0, 0.2) 0px 10px 30px 0px;
            color: rgb(51, 51, 51);
            display: flex;
            flex-direction: column;
            width: 98%;
            max-width: 340px;
            padding: 15px;
            text-align: center;
            margin-top: 10px;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        .home-link {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background-color: #f5f5f7;
            color: #4a4a4a;
            text-decoration: none;
            font-size: 18px;
            line-height: 1;
        }
        .home-link:hover {
            background-color: #e0e0e5;
        }
        h1 {
            color: rgb(51, 51, 51);
            font-size: 1.4rem;
            margin: 0 0 5px;
        }
        .subtitle {
            color: rgb(102, 102, 102);
            font-size: 0.8rem;
            margin: 0 0 12px;
        }
        #slideList {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }
        .slide-row {
            display: flex;
            align-items: center;
            gap: 8px;
            background-color: white;
            border: 1px solid rgb(224, 224, 224);
            border-radius: 8px;
            box-shadow: rgba(0, 0, 0, 0.1) 0px 2px 4px 0px;
            padding: 8px;
            text-align: left;
        }
        .slide-row .thumb {
            width: 48px;
            height: 48px;
            object-fit: cover;
            border-radius: 6px;
            flex-shrink: 0;
        }
        .slide-row .slide-text {
            flex: 1;
            font-size: 0.85rem;
            word-break: break-word;
            min-width: 0;
        }
        .slide-row .row-controls {
            display: flex;
            gap: 4px;
            flex-shrink: 0;
            margin-left: auto;
        }
        .row-controls button {
            width: 30px;
            height: 30px;
            border: none;
            border-radius: 6px;
            background-color: #f5f5f7;
            color: #4a4a4a;
            font-size: 13px;
            cursor: pointer;
            padding: 0;
            touch-action: manipulation;
        }
        .row-controls button:hover {
            background-color: #e0e0e5;
        }
        .row-controls button.delete {
            color: #e53e3e;
        }
        #emptyState {
            color: rgb(102, 102, 102);
            font-size: 0.85rem;
            padding: 14px 6px;
            line-height: 1.5;
        }
        .add-row {
            display: flex;
            gap: 8px;
            margin-bottom: 8px;
        }
        .add-row input {
            flex: 1;
            min-width: 0;
            padding: 10px;
            border: 1px solid rgb(224, 224, 224);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }
        .add-row button {
            border: none;
            border-radius: 8px;
            background-color: rgb(66, 153, 225);
            color: white;
            font-size: 14px;
            font-weight: 700;
            padding: 0 14px;
            cursor: pointer;
            touch-action: manipulation;
        }
        #addImageBtn {
            border: none;
            border-radius: 8px;
            background-color: rgb(66, 153, 225);
            color: white;
            font-size: 14px;
            font-weight: 700;
            padding: 10px;
            cursor: pointer;
            margin-bottom: 12px;
            touch-action: manipulation;
        }
        .add-row button:hover, #addImageBtn:hover {
            opacity: 0.9;
        }
        .duration-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font-size: 0.85rem;
            color: #4a4a4a;
            margin-bottom: 12px;
        }
        .duration-row select {
            padding: 6px 10px;
            border: 1px solid rgb(224, 224, 224);
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
            background-color: white;
        }
        #playBtn {
            border: none;
            border-radius: 25px;
            background-color: rgb(72, 187, 120);
            color: white;
            font-size: 16px;
            font-weight: 700;
            padding: 12px;
            cursor: pointer;
            touch-action: manipulation;
        }
        #playBtn:hover {
            opacity: 0.9;
        }
        #playBtn:disabled {
            background-color: #a0aec0;
            cursor: default;
            opacity: 1;
        }

        #player {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgb(102, 126, 234) 0%, rgb(118, 75, 162) 100%);
            z-index: 10;
            display: none;
            cursor: pointer;
        }
        #player.active {
            display: block;
        }
        .slide {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transition: opacity 1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        .slide .img {
            position: absolute;
            top: -5%;
            left: -5%;
            width: 110%;
            height: 110%;
            background-size: cover;
            background-position: center;
            will-change: transform;
        }
        .slide .text {
            color: white;
            font-size: clamp(26px, 6vw, 46px);
            font-weight: 700;
            text-align: center;
            padding: 0 24px;
            max-width: 90%;
            line-height: 1.35;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.35);
            will-change: transform;
        }
        @keyframes kenburns {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }
        @keyframes textIn {
            from { transform: scale(0.94); }
            to { transform: scale(1); }
        }
        #exitHint {
            position: absolute;
            bottom: 24px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="content">
        <div class="card">
            <a href="index.html" class="home-link" aria-label="Home">←</a>
            <h1 id="title"></h1>
            <div id="subtitle" class="subtitle"></div>
            <div id="slideList"></div>
            <div id="emptyState"></div>
            <div class="add-row">
                <input id="affirmationInput" type="text" maxlength="200">
                <button id="addTextBtn"></button>
            </div>
            <button id="addImageBtn"></button>
            <input type="file" id="imageInput" accept="image/*" hidden>
            <div class="duration-row">
                <label for="durationSelect" id="durationLabel"></label>
                <select id="durationSelect">
                    <option value="3">3</option>
                    <option value="5" selected>5</option>
                    <option value="8">8</option>
                    <option value="10">10</option>
                </select>
            </div>
            <div class="duration-row">
                <label for="musicSelect" id="musicLabel"></label>
                <select id="musicSelect">
                    <option value="off"></option>
                    <option value="calm"></option>
                    <option value="ocean"></option>
                    <option value="rain"></option>
                </select>
            </div>
            <button id="playBtn"></button>
        </div>
    </div>

    <div id="player">
        <div id="slideA" class="slide"></div>
        <div id="slideB" class="slide"></div>
        <div id="exitHint"></div>
    </div>

                subtitle: "Visualiseer je doelen – bekijk twee keer per dag",

                add: "Toevoegen",

                play: "Film afspelen",
                empty: "Voeg affirmaties en afbeeldingen toe om je persoonlijke gedachtenfilm te maken",

                musicCalm: "Rustige tonen",

                musicRain: "Regen"
            },
            vi: {
                title: "Phim Tâm Trí",
                subtitle: "Hình dung mục tiêu của bạn – xem hai lần mỗi ngày",
                placeholder: "Viết một câu khẳng định...",

                play: "Phát phim",
                empty: "Thêm câu khẳng định và hình ảnh để tạo bộ phim tâm trí của riêng bạn",
                secondsPerSlide: "Giây mỗi trang",
                deleteSlide: "Xóa",
                tapToExit: "Chạm để thoát",
                storageFull: "Bộ nhớ đã đầy. Xóa một số hình ảnh và thử lại.",
                musicLabel: "Âm nhạc",
                musicOff: "Tắt",
                musicCalm: "Âm thanh êm dịu",
                musicOcean: "Sóng biển",

            },
            th: {
                title: "ภาพยนตร์ในใจ",
                subtitle: "จินตนาการถึงเป้าหมายของคุณ – ดูวันละสองครั้ง",
                placeholder: "เขียนคำยืนยันเชิงบวก...",
                add: "เพิ่ม",
                addImage: "เพิ่มรูปภาพ",
                play: "เล่นภาพยนตร์",
                empty: "เพิ่มคำยืนยันและรูปภาพเพื่อสร้างภาพยนตร์ในใจของคุณเอง",
                secondsPerSlide: "วินาทีต่อสไลด์",
                deleteSlide: "ลบ",
                tapToExit: "แตะเพื่อออก",
                storageFull: "พื้นที่จัดเก็บเต็ม ลบรูปภาพบางส่วนแล้วลองอีกครั้ง",
                musicLabel: "เพลง",
                musicOff: "ปิด",
                musicCalm: "เสียงสงบ",
                musicOcean: "คลื่นทะเล",
                musicRain: "ฝน"
            }
        };

        const userLang = (navigator.language || 'en').split('-')[0];
        const lang = translations[userLang] ? userLang : 'en';
        const t = translations[lang];
        document.documentElement.lang = lang;

        let wakeLock = null;
        let wakeLockWanted = false;
        async function requestWakeLock() {
            wakeLockWanted = true;
            if (!('wakeLock' in navigator)) return;
            try {
                wakeLock = await navigator.wakeLock.request('screen');
            } catch (e) {
                // Wake lock is best-effort; playback still works without it
            }
        }
        function releaseWakeLock() {
            wakeLockWanted = false;
            if (wakeLock) {
                wakeLock.release().catch(function() {});
                wakeLock = null;
            }
        }
        document.addEventListener('visibilitychange', function() {
            if (document.visibilityState === 'visible' && wakeLockWanted) {
                requestWakeLock();
            }
        });

        const STORAGE_KEY = 'mindMovieSlides';
        const DURATION_KEY = 'mindMovieDuration';
        const MUSIC_KEY = 'mindMovieMusic';

        let slides = [];
        try {
            slides = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        } catch (e) {
            slides = [];
        }

        const slideList = document.getElementById('slideList');
        const emptyState = document.getElementById('emptyState');
        const affirmationInput = document.getElementById('affirmationInput');
        const addTextBtn = document.getElementById('addTextBtn');
        const addImageBtn = document.getElementById('addImageBtn');
        const imageInput = document.getElementById('imageInput');
        const durationSelect = document.getElementById('durationSelect');
        const musicSelect = document.getElementById('musicSelect');
        const playBtn = document.getElementById('playBtn');
        const player = document.getElementById('player');
        const layers = [document.getElementById('slideA'), document.getElementById('slideB')];

        document.getElementById('title').textContent = t.title;
        document.getElementById('subtitle').textContent = t.subtitle;
        document.getElementById('durationLabel').textContent = t.secondsPerSlide;
        document.getElementById('musicLabel').textContent = t.musicLabel;
        document.getElementById('exitHint').textContent = t.tapToExit;
        musicSelect.options[0].textContent = t.musicOff;
        musicSelect.options[1].textContent = t.musicCalm;
        musicSelect.options[2].textContent = t.musicOcean;
        musicSelect.options[3].textContent = t.musicRain;
        affirmationInput.placeholder = t.placeholder;
        addTextBtn.textContent = t.add;
        addImageBtn.textContent = '📷 ' + t.addImage;
        playBtn.textContent = '▶ ' + t.play;

        durationSelect.value = localStorage.getItem(DURATION_KEY) || '5';
        durationSelect.addEventListener('change', function() {
            localStorage.setItem(DURATION_KEY, durationSelect.value);
        });

        musicSelect.value = localStorage.getItem(MUSIC_KEY) || 'calm';
        if (!musicSelect.value) musicSelect.value = 'calm';
        musicSelect.addEventListener('change', function() {
            localStorage.setItem(MUSIC_KEY, musicSelect.value);
        });

        // Ambient soundscapes synthesized with the Web Audio API: no audio
        // files to download or cache, and the loops have no seam
        const ambient = (function() {
            let ctx = null;
            let master = null;

            function makeNoiseBuffer(context, brown) {
                const length = context.sampleRate * 4;
                const buffer = context.createBuffer(1, length, context.sampleRate);
                const data = buffer.getChannelData(0);
                let last = 0;
                for (let i = 0; i < length; i++) {
                    const white = Math.random() * 2 - 1;
                    if (brown) {
                        last = (last + 0.02 * white) / 1.02;
                        data[i] = last * 3.5;
                    } else {
                        data[i] = white;
                    }
                }
                return buffer;
            }

            function makeNoiseSource(context, brown) {
                const source = context.createBufferSource();
                source.buffer = makeNoiseBuffer(context, brown);
                source.loop = true;
                source.start();
                return source;
            }

            // Slow sine wobble applied to an AudioParam (gain, filter cutoff...)
            function addLfo(context, param, frequency, depth) {
                const osc = context.createOscillator();
                osc.frequency.value = frequency;
                const gain = context.createGain();
                gain.gain.value = depth;
                osc.connect(gain);
                gain.connect(param);
                osc.start();
            }

            function buildCalm(context, out) {
                // A soft Cadd9 voicing; each voice swells in and out at its
                // own pace so the chord slowly evolves
                const voices = [
                    { freq: 130.81, rate: 0.031 },
                    { freq: 196.00, rate: 0.043 },
                    { freq: 261.63, rate: 0.057 },
                    { freq: 293.66, rate: 0.071 },
                    { freq: 392.00, rate: 0.067 }
                ];
                const filter = context.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 900;
                addLfo(context, filter.frequency, 0.02, 250);
                filter.connect(out);
                voices.forEach(function(voice) {
                    const gain = context.createGain();
                    gain.gain.value = 0.1;
                    addLfo(context, gain.gain, voice.rate, 0.08);
                    [-3, 3].forEach(function(cents) {
                        const osc = context.createOscillator();
                        osc.type = 'sine';
                        osc.frequency.value = voice.freq;
                        osc.detune.value = cents;
                        osc.connect(gain);
                        osc.start();
                    });
                    gain.connect(filter);
                });
                return 0.35;
            }

            function buildOcean(context, out) {
                const filter = context.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.value = 420;
                addLfo(context, filter.frequency, 0.07, 160);
                const swell = context.createGain();
                swell.gain.value = 0.55;
                // Two LFOs at different rates make the waves irregular
                addLfo(context, swell.gain, 0.08, 0.3);
                addLfo(context, swell.gain, 0.131, 0.13);
                makeNoiseSource(context, true).connect(filter);
                filter.connect(swell);
                swell.connect(out);
                return 0.5;
            }

            function buildRain(context, out) {
                const highpass = context.createBiquadFilter();
                highpass.type = 'highpass';
                highpass.frequency.value = 1100;
                const lowpass = context.createBiquadFilter();
                lowpass.type = 'lowpass';
                lowpass.frequency.value = 6000;
                const gain = context.createGain();
                gain.gain.value = 0.9;
                addLfo(context, gain.gain, 0.23, 0.07);
                makeNoiseSource(context, false).connect(highpass);
                highpass.connect(lowpass);
                lowpass.connect(gain);
                gain.connect(out);
                return 0.16;
            }

            function start(type) {
                stop();
                if (type === 'off') return;
                const AC = window.AudioContext || window.webkitAudioContext;
                if (!AC) return;
                try {
                    ctx = new AC();
                    ctx.resume().catch(function() {});
                    master = ctx.createGain();
                    master.gain.value = 0;
                    master.connect(ctx.destination);
                    const builders = { calm: buildCalm, ocean: buildOcean, rain: buildRain };
                    const level = builders[type](ctx, master);
                    master.gain.linearRampToValueAtTime(level, ctx.currentTime + 2.5);
                } catch (e) {
                    ctx = null;
                    master = null;
                }
            }

            function stop() {
                if (!ctx) return;
                const oldCtx = ctx;
                const oldMaster = master;
                ctx = null;
                master = null;
                try {
                    oldMaster.gain.cancelScheduledValues(oldCtx.currentTime);
                    oldMaster.gain.setValueAtTime(oldMaster.gain.value, oldCtx.currentTime);
                    oldMaster.gain.linearRampToValueAtTime(0, oldCtx.currentTime + 0.8);
                } catch (e) {}
                setTimeout(function() {
                    oldCtx.close().catch(function() {});
                }, 1000);
            }

            return { start: start, stop: stop };
        })();

        function saveSlides() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(slides));
                return true;
            } catch (e) {
                alert(t.storageFull);
                return false;
            }
        }

        function renderList() {
            slideList.innerHTML = '';
            emptyState.textContent = slides.length ? '' : t.empty;
            playBtn.disabled = slides.length === 0;

            slides.forEach(function(slide, i) {
                const row = document.createElement('div');
                row.className = 'slide-row';

                if (slide.type === 'image') {
                    const thumb = document.createElement('img');
                    thumb.className = 'thumb';
                    thumb.src = slide.src;
                    thumb.alt = '';
                    row.appendChild(thumb);
                } else {
                    const text = document.createElement('div');
                    text.className = 'slide-text';
                    text.textContent = slide.text;
                    row.appendChild(text);
                }

                const controls = document.createElement('div');
                controls.className = 'row-controls';

                const upBtn = document.createElement('button');
                upBtn.textContent = '▲';
                upBtn.setAttribute('aria-label', 'Move up');
                upBtn.disabled = i === 0;
                upBtn.addEventListener('click', function() {
                    slides.splice(i - 1, 0, slides.splice(i, 1)[0]);
                    saveSlides();
                    renderList();
                });

                const downBtn = document.createElement('button');
                downBtn.textContent = '▼';
                downBtn.setAttribute('aria-label', 'Move down');
                downBtn.disabled = i === slides.length - 1;
                downBtn.addEventListener('click', function() {
                    slides.splice(i + 1, 0, slides.splice(i, 1)[0]);
                    saveSlides();
                    renderList();
                });

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete';
                deleteBtn.textContent = '✕';
                deleteBtn.setAttribute('aria-label', t.deleteSlide);
                deleteBtn.addEventListener('click', function() {
                    slides.splice(i, 1);
                    saveSlides();
                    renderList();
                });

                controls.appendChild(upBtn);
                controls.appendChild(downBtn);
                controls.appendChild(deleteBtn);
                row.appendChild(controls);
                slideList.appendChild(row);
            });
        }

        function addSlide(slide) {
            slides.push(slide);
            if (!saveSlides()) {
                slides.pop();
            }
            renderList();
        }

        function addAffirmation() {
            const text = affirmationInput.value.trim();
            if (!text) return;
            addSlide({ type: 'text', text: text });
            affirmationInput.value = '';
        }

        addTextBtn.addEventListener('click', addAffirmation);
        affirmationInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') addAffirmation();
        });

        addImageBtn.addEventListener('click', function() {
            imageInput.click();
        });

        imageInput.addEventListener('change', function() {
            const file = imageInput.files[0];
            imageInput.value = '';
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function() {
                const img = new Image();
                img.onload = function() {
                    // Downscale and re-encode as JPEG so a movie's worth of
                    // images fits within the localStorage quota
                    const maxSize = 1000;
                    const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.round(img.width * scale);
                    canvas.height = Math.round(img.height * scale);
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    addSlide({ type: 'image', src: canvas.toDataURL('image/jpeg', 0.72) });
                };
                img.src = reader.result;
            };
            reader.readAsDataURL(file);
        });

        let playTimer = null;
        let playIndex = 0;
        let activeLayer = 0;

        function renderSlideInto(el, slide, duration) {
            el.innerHTML = '';
            if (slide.type === 'image') {
                const img = document.createElement('div');
                img.className = 'img';
                img.style.backgroundImage = 'url("' + slide.src + '")';
                img.style.animation = 'kenburns ' + (duration + 1.5) + 's ease-out forwards';
                el.appendChild(img);
            } else {
                const text = document.createElement('div');
                text.className = 'text';
                text.textContent = slide.text;
                text.style.animation = 'textIn ' + (duration + 1.5) + 's ease-out forwards';
                el.appendChild(text);
            }
        }

        function advance() {
            const duration = parseInt(durationSelect.value, 10);
            const next = layers[1 - activeLayer];
            renderSlideInto(next, slides[playIndex % slides.length], duration);
            next.style.opacity = '1';
            layers[activeLayer].style.opacity = '0';
            activeLayer = 1 - activeLayer;
            playIndex++;
        }

        function startPlayback() {
            if (!slides.length) return;
            playIndex = 0;
            player.classList.add('active');
            requestWakeLock();
            ambient.start(musicSelect.value);
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(function() {});
            }
            advance();
            playTimer = setInterval(advance, parseInt(durationSelect.value, 10) * 1000);
        }

        function stopPlayback() {
            clearInterval(playTimer);
            playTimer = null;
            player.classList.remove('active');
            layers.forEach(function(layer) {
                layer.style.opacity = '0';
                layer.innerHTML = '';
            });
            ambient.stop();
            releaseWakeLock();
            if (document.fullscreenElement) {
                document.exitFullscreen().catch(function() {});
            }
        }

        playBtn.addEventListener('click', startPlayback);
        player.addEventListener('click', stopPlayback);

        renderList();
    });
    </script>
